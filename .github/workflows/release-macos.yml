name: Build & Release for macOS
run-name: Build & Release macOS ${{ github.event.inputs.version || 'Auto-detected' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0). Leave empty to use package.json version.'
        required: false

jobs:
  release:
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Determine Version
        run: |
          if [ -z "${{ github.event.inputs.version }}" ]; then
            PACKAGE_VERSION=$(node -p "require('./package.json').version")
            echo "VERSION=v${PACKAGE_VERSION}" >> $GITHUB_ENV
          else
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          fi

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --ci

      # Apple Silicon + Intel. Without an Apple certificate the app is ad-hoc signed
      # (.erb/scripts/adhoc-sign.js), so it starts after "right-click > Open" once.
      - name: Build and package macOS application
        run: npm run package -- --config.mac.hardenedRuntime=false --config.mac.gatekeeperAssess=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Create/Update GitHub Release and upload artifact
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION }}
          name: Stackrun ${{ env.VERSION }}
          body: |
            macOS: Stackrun-*-arm64.dmg for Apple Silicon (M1+), Stackrun-*.dmg for Intel.
            The build is not notarized: the first time, right-click the app > Open
            (or run `xattr -cr /Applications/Stackrun.app`).
          files: |
            release/build/*.dmg
            release/build/*.zip
            release/build/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
